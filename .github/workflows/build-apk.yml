name: Build APK

on:
  push:
    paths: ['android/**', '.github/workflows/build-apk.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/tether.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tether-apk
          path: ${{ runner.temp }}/tether.apk
          if-no-files-found: error

      # On main, also keep a stable download link:
      # https://github.com/<owner>/<repo>/releases/download/latest/tether.apk
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "$RUNNER_TEMP/tether.apk" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Built from ${GITHUB_SHA::7}. Installs over the previous build; allow installs from unknown sources."
