plugins {
    id 'com.android.application'
}

def runNumber = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')

android {
    namespace 'app.tether'
    compileSdk 34

    defaultConfig {
        applicationId 'app.tether'
        minSdk 26
        targetSdk 34
        // CI passes its run number so every build can be installed over the previous one.
        versionCode runNumber
        versionName '1.2'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // A fixed debug key (committed on purpose) keeps CI builds installable over each other.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'io.github.webrtc-sdk:android:144.7559.15'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
